[project]
name = "beyond-cloud-brand-intel"
version = "0.1.0"
description = "Beyond Cloud Brand Intelligence Automation Platform - backend"
authors = [
    { name = "Abhishek ms", email = "abhishek.ms@theranize.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "androguard>=4.1.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.108",
    "celery>=5.6.3",
    "certstream>=1.12",
    "checkdmarc>=6.0.3",
    "confusable-homoglyphs>=3.3.1",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "dkimpy>=1.1.8",
    "dnspython>=2.8.0",
    "dnstwist>=20250130",
    "email-validator>=2.3.0",
    "extract-msg>=0.56.1",
    "fastapi>=0.142.2",
    "google-play-scraper>=1.2.7",
    "httpx>=0.28.1",
    "idna>=3.20",
    "imagehash>=4.3.2",
    "jellyfish>=1.2.1",
    "mmh3>=5.3.1",
    "oletools>=0.60.2",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pdfminer-six>=20260107",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "pyspf>=2.0.14",
    "python-docx>=1.2.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "selectolax>=1.0.0",
    "sqlalchemy>=2.1.3",
    "structlog>=26.1.0",
    "telethon>=1.45.0",
    "tenacity>=9.1.4",
    "tldextract>=5.4.0",
    "uvicorn>=0.54.0",
    "weasyprint>=70.0",
    "whoisit>=4.0.5",
    "yara-python>=4.5.4",
]



[tool.uv]
package = false
# certstream ships only an sdist; Windows Application Control blocks uv's isolated
# build env, so a locally built wheel is used instead.
find-links = ["wheels"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["req(*ids): requirement IDs from docs/requirements/01-requirements-register.md proven by this test"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI Depends()/Query() defaults are the framework idiom. UP042: str+Enum kept for SQLAlchemy enums.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"app/alembic/versions/**" = ["E501"]  # generated migrations
"app/api/exports.py" = ["E501"]  # inline HTML/CSS template for the PDF
